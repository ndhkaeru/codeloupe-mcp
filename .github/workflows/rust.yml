name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run (Mondays 00:00 UTC) so cargo audit/deny catch newly
    # published advisories even when no code changes.
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check synchronized release versions
        run: node packages/npm/scripts/sync-version.js --check

      - name: Test version synchronization
        run: node --test packages/npm/scripts/test-sync-version.js

      - name: Run tests
        run: cargo test --workspace --release --locked

      - name: Test npm upgrade while the launcher is running
        if: runner.os == 'Windows'
        run: node packages/npm/scripts/test-upgrade-while-running.js

  linux-file-workflows:
    name: Linux filesystem failure paths
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Cache Linux test artifacts and Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            target/linux-file-workflows
            target/linux-file-workflows-cargo
          key: ${{ runner.os }}-linux-file-workflows-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'vendor/lru-compat/Cargo.toml', 'rust-toolchain.toml', 'scripts/test-linux-file-workflows.py') }}
          restore-keys: |
            ${{ runner.os }}-linux-file-workflows-

      - name: Execute ignored tests with seccomp and negative controls
        run: python3 scripts/test-linux-file-workflows.py

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: cargo audit -D warnings

  deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check advisories bans licenses sources

  npm-metadata:
    name: NPM and MCP Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check npm launcher syntax
        run: |
          node --check packages/npm/bin/codeloupe-mcp.js
          node --check packages/npm/scripts/prepare-npm-assets.js
          node --check packages/npm/scripts/sync-version.js
          node --check packages/npm/scripts/test-sync-version.js
          node --check packages/npm/scripts/smoke.js
          node --check packages/npm/scripts/test-package-layout.js
          node --check packages/npm/scripts/test-launcher-resolution.js
          node --check packages/npm/scripts/test-packed-install.js
          node --check packages/npm/scripts/test-launcher-runtime.js
          node --check packages/npm/scripts/test-upgrade-while-running.js
          (cd packages/npm && npm run test:env && npm run test:layout && npm run test:runtime)

      - name: Check synchronized release versions and MCP identity
        run: npm --prefix packages/npm run version:check

      - name: Check npm package shape
        working-directory: packages/npm
        run: npm pack --dry-run
